plugins {
    id("io.micronaut.build.internal.servlet.implementation")
}

// Groovy equivalents of the guide sources in test-suite, under the same fully qualified
// names so that the `snippet::` macro can render a Groovy tab.
dependencies {
    testImplementation(projects.micronautServletWebsocket)
    // Maps the Jakarta WebSocket annotations of the documented endpoint; the Groovy
    // transformations load the mappers from the compile classpath.
    testCompileOnly(projects.micronautServletProcessor)
    testImplementation(projects.micronautHttpServerJetty)
    testImplementation(libs.jetty.websocket.jakarta.server) {
        exclude(group: "org.eclipse.jetty.ee10", module: "jetty-ee10-annotations")
    }
    testImplementation(mn.micronaut.jackson.databind)
    testImplementation(mnLogging.logback.classic)
}

micronautBuild {
    binaryCompatibility {
        enabled = false
    }
}
