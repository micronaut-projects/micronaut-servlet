# Globally disable micronaut-security for the test environment, matching the other modules,
# so that the documented sources can be exercised without security configuration.
micronaut:
  security:
    enabled: false
  server:
    # Jetty runs the tests. Tomcat and Undertow are on the classpath for the documented server
    # customizers, whose tests enable the runtime they need.
    tomcat:
      enabled: false
    undertow:
      enabled: false
