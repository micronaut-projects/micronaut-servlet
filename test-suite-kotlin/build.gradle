plugins {
    id 'io.micronaut.build.internal.servlet.base'
    id("io.micronaut.build.internal.kotlin-kapt")
}

repositories {
    mavenCentral()
}

// Kotlin equivalents of the guide sources in test-suite, under the same fully qualified
// names so that the `snippet::` macro can render a Kotlin tab.
dependencies {
    kaptTest mn.micronaut.inject.java
    kaptTest projects.micronautServletProcessor

    testRuntimeOnly mnTest.junit.jupiter.engine

    testImplementation libs.kotlin.stdlib.jdk8
    testImplementation libs.kotlin.reflect
    testImplementation mn.kotlinx.coroutines.core
    testImplementation libs.kotest.runner
    testImplementation mnTest.micronaut.test.junit5
    testImplementation mn.micronaut.http.client
    testImplementation mn.micronaut.jackson.databind
    testImplementation(mnReactor.micronaut.reactor)

    testImplementation(projects.micronautServletWebsocket)
    // Maps the Jakarta WebSocket annotations of the documented endpoint.
    kaptTest projects.micronautServletProcessor
    testImplementation(projects.micronautHttpServerJetty)
    // Jetty runs the tests; Tomcat and Undertow are disabled in application-test.yaml and enabled
    // by the tests of their documented server customizers only.
    testImplementation(projects.micronautHttpServerTomcat)
    testImplementation(projects.micronautHttpServerUndertow)
    // The server classes the customizers reference are implementation dependencies of the runtimes.
    testImplementation(libs.tomcat.embed.core)
    testImplementation(libs.undertow.servlet)
    testImplementation(libs.jetty.websocket.jakarta.server) {
        exclude(group: "org.eclipse.jetty.ee10", module: "jetty-ee10-annotations")
    }
    testRuntimeOnly(mnLogging.logback.classic)
    // the YAML configuration of the test suite
    testRuntimeOnly(mn.snakeyaml)
}

tasks.named('test') {
    useJUnitPlatform()
}
