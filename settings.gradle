pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'io.micronaut.build.shared.settings' version '8.0.1'
}

enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS")

rootProject.name = 'servlet-parent'

micronautBuild {
    useStandardizedProjectNames = true
    importMicronautCatalog()
    importMicronautCatalog("micronaut-reactor")
    importMicronautCatalog("micronaut-security")
    importMicronautCatalog("micronaut-serde")
    importMicronautCatalog("micronaut-session")
    importMicronautCatalog("micronaut-validation")
}

include 'servlet-bom'
include 'servlet-processor'
include 'servlet-core'
include 'servlet-api'
include 'servlet-engine'
include 'servlet-websocket'
include 'http-server-jdk'
include 'http-server-jetty'
include 'http-server-undertow'
include 'http-server-tomcat'
include 'http-poja-common'
include 'http-poja-apache'
include 'http-poja-test'
include 'test-suite-http-server-tck-jdk'
include 'test-suite-http-server-tck-tomcat'
include 'test-suite-http-server-tck-undertow'
include 'test-suite-http-server-tck-jetty'
include 'test-suite-http-server-tck-poja-apache'
include 'test-suite'
include 'test-suite-groovy'
include 'test-suite-kotlin'
include 'test-suite-jetty-default-access-log'
include 'test-suite-jetty-logback-access-log'
include 'test-suite-kotlin-jetty'
include 'test-sample-poja'

// Develop against a local checkout of micronaut-core (for example while adding HTTP server TCK tests) with
//   ./gradlew -PcoreDir=/path/to/micronaut-core :test-suite-http-server-tck-jetty:test
// Gradle substitutes the io.micronaut:* dependencies with that build, so a TCK test can be run against every
// servlet runtime here before it is upstreamed. Equivalent to --include-build on the command line.
def coreDir = providers.gradleProperty('coreDir').orNull
if (coreDir) {
    includeBuild(coreDir)
}
