plugins {
    id("java")
    id 'jacoco'
    id 'org.graalvm.buildtools.native'
}

repositories {
    mavenCentral()
}

dependencies {
    testAnnotationProcessor(platform(mn.micronaut.core.bom))
    testAnnotationProcessor(mn.micronaut.inject.java)
    testImplementation(platform(mn.micronaut.core.bom))
    testImplementation(mn.micronaut.inject.java)

    testImplementation(mn.micronaut.http.client)
    testImplementation(mn.micronaut.http.server.tck)
    testImplementation(mn.micronaut.jackson.databind)
    testImplementation(libs.junit.platform.engine)
    testImplementation(mnTest.junit.jupiter.engine)
    testRuntimeOnly(mnLogging.logback.classic)
    testRuntimeOnly(mnValidation.micronaut.validation)
}

tasks.named("test") {
    useJUnitPlatform()
}

// this module has no production code of its own; it exists to run the shared TCK against a server implementation.
// Its own report would be empty, and the coverage it produces is attributed back to the modules that own the code
// by the aggregation in the root build
tasks.named("jacocoTestReport") {
    enabled = false
}

graalvmNative {
    metadataRepository {
        enabled = true
    }
    binaries {
        all {
            resources.autodetect()
            buildArgs.add("-H:+SharedArenaSupport")
        }
    }
}
