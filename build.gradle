plugins {
    id "io.micronaut.build.internal.parent"
}

repositories {
    mavenCentral()
}
configurations.all {
    resolutionStrategy {
        preferProjectModules()
    }
}

// Sonar reads one aggregate coverage report, and a module takes part in it by applying the quality checks that
// every module with production code applies. The HTTP Server TCK suites hold no production code and apply no
// quality checks, so the 1260 TCK tests that drive the servlet engine hardest would otherwise record nothing
// against the classes they exercise, leaving the request and response pipeline looking untested when it is the
// most heavily exercised code in the repository. Enrol the suites here so their coverage counts.
dependencies {
    subprojects.findAll { it.path.startsWith(':test-suite-http-server-tck') }.each {
        jacocoAggregation it
    }
}
