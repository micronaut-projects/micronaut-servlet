plugins { id 'java' }
repositories { mavenLocal(); mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
def mnVersion = project.findProperty('mnVersion') ?: '5.2.0'
def servletVersion = project.findProperty('servletVersion') ?: '6.2.0-SNAPSHOT'
def servers = [netty: "io.micronaut:micronaut-http-server-netty",
               tomcat: "io.micronaut.servlet:micronaut-http-server-tomcat:${servletVersion}",
               jetty: "io.micronaut.servlet:micronaut-http-server-jetty:${servletVersion}",
               undertow: "io.micronaut.servlet:micronaut-http-server-undertow:${servletVersion}",
               jdk: "io.micronaut.servlet:micronaut-http-server-jdk:${servletVersion}"]
configurations { base }
dependencies {
    annotationProcessor platform("io.micronaut:micronaut-core-bom:${mnVersion}"), platform("io.micronaut.serde:micronaut-serde-bom:3.1.0")
    annotationProcessor "io.micronaut:micronaut-inject-java"
    annotationProcessor "io.micronaut.serde:micronaut-serde-processor"
    implementation platform("io.micronaut:micronaut-core-bom:${mnVersion}"), platform("io.micronaut.serde:micronaut-serde-bom:3.1.0")
    implementation "io.micronaut:micronaut-http-server"
    implementation "io.micronaut:micronaut-runtime"
    implementation "io.micronaut.serde:micronaut-serde-jackson"
    implementation "io.micronaut:micronaut-jackson-databind"
    implementation platform("io.micronaut.reactor:micronaut-reactor-bom:4.1.0")
    implementation "io.micronaut.reactor:micronaut-reactor"
    implementation "org.slf4j:slf4j-simple:2.0.17"
}
servers.each { name, dep ->
    def cfg = configurations.create("run${name.capitalize()}Cp") { extendsFrom configurations.runtimeClasspath }
    dependencies.add(cfg.name, dependencies.platform("io.micronaut:micronaut-core-bom:${mnVersion}"))
    dependencies.add(cfg.name, dep)
    tasks.register("run${name.capitalize()}", JavaExec) {
        classpath = sourceSets.main.output + cfg
        mainClass = 'bench.Application'
        jvmArgs = ['-Xmx1g', '-XX:+UseParallelGC']
        systemProperty 'server.name', name
        if (project.hasProperty('filter')) systemProperty 'bench.filter', project.property('filter')
        if (project.hasProperty('loom')) { systemProperty 'micronaut.netty.event-loops.default.loom-carrier', 'true'; jvmArgs += ['--add-opens=java.base/java.lang=ALL-UNNAMED'] }
        if (project.hasProperty('vt')) systemProperty 'micronaut.servlet.enable-virtual-threads', project.property('vt')
        if (project.hasProperty('nettyplatform')) { systemProperty 'micronaut.executors.blocking.virtual', 'false'; systemProperty 'micronaut.executors.blocking.type', 'fixed'; systemProperty 'micronaut.executors.blocking.n-threads', '200' }
        if (project.hasProperty('jvmextra')) jvmArgs += project.property('jvmextra').split(' ').toList()
    }
}
